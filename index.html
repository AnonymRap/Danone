<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do-List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDEAE1;
    --paper-raised:#F5F3ED;
    --ink:#23262B;
    --ink-soft:#5B5A53;
    --line:#D8D3C5;
    --accent:#2F5233;
    --accent-soft:#E4E9DF;
    --todo:#9B9689;
    --todo-bg:#EFEDE7;
    --progress:#B8792A;
    --progress-bg:#F6E9D6;
    --done:#2F5233;
    --done-bg:#E1E8DD;
    --danger:#A23E30;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,.serif{font-family:'Zilla Slab', serif;}

  /* ---------- Layout shell ---------- */
  .shell{max-width:1180px;margin:0 auto;padding:0 28px 80px;}
  header.top{
    display:flex;justify-content:space-between;align-items:flex-end;
    padding:44px 0 28px;border-bottom:2px solid var(--ink);
    flex-wrap:wrap;gap:16px;
  }
  header.top h1{
    font-size:34px;font-weight:600;margin:0;letter-spacing:-0.01em;
  }
  header.top .sub{color:var(--ink-soft);font-size:14px;margin-top:4px;}
  .who{text-align:right;font-size:13px;color:var(--ink-soft);}
  .who button{
    margin-top:6px;background:none;border:1px solid var(--line);
    color:var(--ink);padding:6px 12px;font-size:12px;cursor:pointer;
    font-family:inherit;
  }
  .who button:hover{border-color:var(--ink);}

  /* ---------- Add task row ---------- */
  .add-row{
    display:flex;gap:10px;margin:28px 0 36px;flex-wrap:wrap;
  }
  .add-row input, .add-row select{
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;padding:11px 12px;border:1px solid var(--line);
    background:var(--paper-raised);color:var(--ink);
  }
  .add-row input[type=text]{flex:1;min-width:220px;}
  .add-row input[name=assignee]{width:160px;}
  .add-row button{
    background:var(--ink);color:var(--paper-raised);border:none;
    padding:11px 20px;font-size:14px;cursor:pointer;font-family:inherit;
    font-weight:500;
  }
  .add-row button:hover{background:var(--accent);}

  /* ---------- Board ---------- */
  .board{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:1px solid var(--ink);}
  @media(max-width:860px){.board{grid-template-columns:1fr;}}
  .col{border-left:1px solid var(--line);padding:0 20px 20px;}
  .col:first-child{border-left:none;}
  @media(max-width:860px){.col{border-left:none;border-top:1px solid var(--line);}
    .col:first-child{border-top:none;}}
  .col-head{
    display:flex;align-items:baseline;gap:8px;
    padding:18px 0 14px;position:sticky;top:0;
  }
  .col-head .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .col-head h2{font-size:16px;font-weight:600;margin:0;}
  .col-head .count{color:var(--ink-soft);font-size:13px;}
  .col.todo .dot{background:var(--todo);}
  .col.progress .dot{background:var(--progress);}
  .col.done .dot{background:var(--done);}

  .card{
    background:var(--paper-raised);border:1px solid var(--line);
    padding:14px 14px 12px;margin-bottom:10px;
  }
  .card .title{font-size:14.5px;line-height:1.4;margin:0 0 8px;word-break:break-word;}
  .card .meta{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--ink-soft);
  }
  .card .assignee{
    background:var(--accent-soft);color:var(--accent);
    padding:2px 8px;font-size:11.5px;font-weight:500;
  }
  .card .actions{display:flex;gap:6px;margin-top:10px;}
  .card select{
    font-family:inherit;font-size:12px;border:1px solid var(--line);
    background:var(--paper);padding:5px 6px;flex:1;
  }
  .card .del{
    border:1px solid var(--line);background:none;color:var(--danger);
    font-size:12px;padding:5px 9px;cursor:pointer;font-family:inherit;
  }
  .card .del:hover{border-color:var(--danger);}
  .empty{color:var(--ink-soft);font-size:13px;padding:8px 0;font-style:italic;}

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--paper);
  }
  .login-box{
    width:340px;padding:36px 32px;border:1px solid var(--line);
    background:var(--paper-raised);
  }
  .login-box h1{font-size:24px;margin:0 0 4px;}
  .login-box p{color:var(--ink-soft);font-size:13px;margin:0 0 22px;}
  .login-box label{display:block;font-size:12px;color:var(--ink-soft);margin:14px 0 5px;}
  .login-box input{
    width:100%;padding:10px 11px;border:1px solid var(--line);
    background:var(--paper);font-family:inherit;font-size:14px;
  }
  .login-box button{
    width:100%;margin-top:20px;padding:11px;background:var(--ink);
    color:var(--paper-raised);border:none;font-size:14px;cursor:pointer;
    font-family:inherit;font-weight:500;
  }
  .login-box button:hover{background:var(--accent);}
  .login-box button:disabled{opacity:0.6;cursor:not-allowed;}
  .msg{font-size:12.5px;margin-top:12px;padding:8px 10px;}
  .msg.error{background:#F3E1DC;color:var(--danger);}
  .msg.ok{background:var(--accent-soft);color:var(--accent);}

  .setup-warning{
    max-width:520px;margin:80px auto;padding:24px 28px;border:1px solid var(--danger);
    background:#F8ECE8;font-size:14px;line-height:1.6;
  }
  .setup-warning code{background:#EDDCD6;padding:1px 5px;}
</style>
</head>
<body>

<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   KONFIGURASI — isi dengan data project Supabase Anda
   ========================================================= */
const SUPABASE_URL = "https://yqrrrjyolfoxstzvntjs.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxcnJyanlvbGZveHN0enZudGpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0NDIwNjgsImV4cCI6MjEwNDAxODA2OH0.erjYKb6AH01_VDEqYui7i3XVVEFJ5orGL24lR3sw29M";
/* ========================================================= */

const app = document.getElementById('app');
let supabaseClient = null;
let session = null;
let tasks = [];
let channel = null;

const STATUS = {
  todo:     { label: "Belum Dikerjakan", cls: "todo",     bg: "todo-bg" },
  progress: { label: "Sedang Dikerjakan", cls: "progress", bg: "progress-bg" },
  done:     { label: "Selesai",          cls: "done",     bg: "done-bg" },
};

function configured(){
  return SUPABASE_URL.startsWith("http") && !SUPABASE_ANON_KEY.startsWith("GANTI");
}

function renderSetupWarning(){
  app.innerHTML = `
    <div class="setup-warning">
      <strong>Konfigurasi belum lengkap.</strong><br><br>
      Buka file <code>index.html</code>, isi <code>SUPABASE_URL</code> dan
      <code>SUPABASE_ANON_KEY</code> di bagian atas file <code>&lt;script&gt;</code>
      dengan data dari project Supabase Anda. Langkah lengkapnya ada di
      <code>README.md</code>.
    </div>`;
}

function renderLogin(){
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <h1>Papan Kerja</h1>
        <p>Masukkan email tim Anda untuk langsung masuk.</p>
        <form id="authForm">
          <label>Email</label>
          <input type="email" name="email" required autocomplete="email">
          <button type="submit">Masuk</button>
        </form>
        <div id="authMsg"></div>
      </div>
    </div>`;

  document.getElementById('authForm').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const email = fd.get('email').trim();
    const msgEl = document.getElementById('authMsg');
    const btn = e.target.querySelector('button');
    
    msgEl.innerHTML = '';
    btn.disabled = true;
    btn.textContent = "Memproses...";

    // Tentukan password universal/default yang sama untuk semua anggota tim
    const passwordTim = "DanoneMII"; 

    // Langsung masuk menggunakan email dan password default
    const { error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: passwordTim
    });

    if (error) {
      btn.disabled = false;
      btn.textContent = "Masuk";
      msgEl.innerHTML = `<div class="msg error">Akses ditolak: Email belum terdaftar atau salah.</div>`;
      return;
    }
  };
}

function displayName(){
  return session?.user?.email?.split('@')[0] || 'Anda';
}

async function renderBoard(){
  const cols = Object.entries(STATUS).map(([key, meta]) => {
    const items = tasks.filter(t => t.status === key);
    return `
      <div class="col ${meta.cls}">
        <div class="col-head">
          <span class="dot"></span>
          <h2>${meta.label}</h2>
          <span class="count">${items.length}</span>
        </div>
        ${items.length === 0 ? `<div class="empty">Belum ada tugas di sini.</div>` : ''}
        ${items.map(cardHtml).join('')}
      </div>`;
  }).join('');

  app.innerHTML = `
    <div class="shell">
      <header class="top">
        <div>
          <h1>Papan Kerja</h1>
          <div class="sub">Daftar tugas tim — tersinkron secara langsung.</div>
        </div>
        <div class="who">
          Masuk sebagai <strong>${displayName()}</strong>
          <br><button id="signOut">Keluar</button>
        </div>
      </header>

      <form class="add-row" id="addForm">
        <input type="text" name="title" placeholder="Tulis tugas baru…" required>
        <input type="text" name="assignee" placeholder="Ditugaskan ke (opsional)">
        <button type="submit">Tambah Tugas</button>
      </form>

      <div class="board">${cols}</div>
    </div>`;

  document.getElementById('signOut').onclick = async () => {
    await supabaseClient.auth.signOut();
    teardownRealtime();
    session = null;
    renderLogin();
  };

  document.getElementById('addForm').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const title = fd.get('title').trim();
    if (!title) return;
    const assignee = fd.get('assignee').trim();
    const { error } = await supabaseClient.from('tasks').insert({
      title, assignee: assignee || null, status: 'todo'
    });
    if (error) {
      alert('Gagal menambah tugas: ' + error.message);
      return;
    }
    e.target.reset();
  };

  document.querySelectorAll('[data-status-select]').forEach(sel => {
    sel.onchange = async (e) => {
      const { error } = await supabaseClient.from('tasks')
        .update({ status: e.target.value, updated_at: new Date().toISOString() })
        .eq('id', e.target.dataset.statusSelect);
      if (error) alert('Gagal mengubah status: ' + error.message);
    };
  });

  document.querySelectorAll('[data-delete]').forEach(btn => {
    btn.onclick = async (e) => {
      const id = e.target.dataset.delete;
      if (!confirm('Hapus tugas ini?')) return;
      const { error } = await supabaseClient.from('tasks').delete().eq('id', id);
      if (error) alert('Gagal menghapus tugas: ' + error.message);
    };
  });
}

function cardHtml(t){
  return `
    <div class="card">
      <p class="title">${escapeHtml(t.title)}</p>
      <div class="meta">
        ${t.assignee ? `<span class="assignee">${escapeHtml(t.assignee)}</span>` : `<span></span>`}
      </div>
      <div class="actions">
        <select data-status-select="${t.id}">
          ${Object.entries(STATUS).map(([k,m]) =>
            `<option value="${k}" ${t.status===k?'selected':''}>${m.label}</option>`).join('')}
        </select>
        <button class="del" data-delete="${t.id}">Hapus</button>
      </div>
    </div>`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function fetchTasks(){
  const { data, error } = await supabaseClient.from('tasks').select('*').order('created_at', { ascending: true });
  if (error) {
    console.error(error);
    app.innerHTML = `<div class="setup-warning">
      <strong>Gagal mengambil data tugas.</strong><br><br>
      ${escapeHtml(error.message)}
    </div>`;
    return;
  }
  tasks = data || [];
  renderBoard();
}

function teardownRealtime(){
  if (channel) { supabaseClient.removeChannel(channel); channel = null; }
}

async function initBoard(){
  await fetchTasks();
  teardownRealtime();
  channel = supabaseClient
    .channel('tasks-realtime')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, () => {
      fetchTasks();
    })
    .subscribe();
}

let appStarted = false;

async function main(){
  if (appStarted) return;
  appStarted = true;

  if (!configured()){
    renderSetupWarning();
    return;
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  
  // Listener tambahan agar aplikasi otomatis merespons login barunya.
  supabaseClient.auth.onAuthStateChange((event, newSession) => {
    if (event === 'SIGNED_IN' && !session) {
      session = newSession;
      initBoard();
    } else if (event === 'SIGNED_OUT') {
      session = null;
      renderLogin();
    }
  });

  const { data: { session: s }, error } = await supabaseClient.auth.getSession();
  
  if (error) {
    console.error(error);
    app.innerHTML = `<div class="setup-warning">
      <strong>Gagal menghubungkan autentikasi Supabase.</strong><br><br>
      ${escapeHtml(error.message)}
    </div>`;
    return;
  }
  
  session = s;
  if (session) {
    initBoard();
  } else {
    renderLogin();
  }
}

main();
</script>
</body>
</html>
